<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="El universo visual de Luca Inova. Detrás de escena, estética noir y proceso creativo.">
    <title>Visual | Luca Inova</title>
    <!-- 1. CARGA DE FUENTES DE ALTA VELOCIDAD -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- SOLUCIÓN: Cargamos New Rocker aquí. display=block evita el parpadeo de fuente fea -->
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=block" rel="stylesheet">
    <!-- 4. ANTI-PARPADEO VISUAL OPTIMIZADO -->
    <style>
        /* Aplicamos el hidden a una clase .reveal, o al 'main' y 'header' 
       directamente, NO al body, para no romper el fixed background */

        /* OPCIÓN A: Si usas la estructura body > main, ocultamos solo main y header */
        body>header,
        body>main {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* El estado cargado se añade por JS */
        body.loaded>header,
        body.loaded>main {
            opacity: 1;
        }
    </style>
    <!-- CORE CSS -->
    <link rel="stylesheet" href="css/core/global.css">
    <link rel="stylesheet" href="css/core/animations.css">

    <!-- PAGE CSS -->
    <link rel="stylesheet" href="css/pages/visual.css">
</head>

<body>

    <!-- HEADER GLOBAL -->
    <header class="site-header">
        <div class="container nav-flex">

            <a href="index.html" class="logo">LUCA INOVA</a>

            <button class="mobile-menu-btn" aria-label="Menú">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <nav class="nav-links">
                <a href="obras.html">Relatos</a>
                <!-- Estado Activo Aquí -->
                <a href="visual.html" class="current-page">Visual</a>
                <a href="sobre_mi.html">Sobre mí</a>
                <a href="contacto.html">Contacto</a>
            </nav>

            <div class="mobile-nav-overlay"></div>
        </div>
    </header>

    <main>

        <!-- SISTEMA DE FONDO (FALTABA ESTO) -->
        <!-- Inyectamos el fondo aquí para que no sea marrón plano -->
        <div class="hero-bg-wrapper">
            <picture>
                <source media="(min-width: 768px)" srcset="assets/images/hero-bg-desktop.jpg" />
                <img src="assets/images/hero-bg-mobile.jpg" alt="Atmósfera oscura" />
            </picture>
        </div>
        <div class="hero-overlay"></div>


        <!-- SECCIÓN 1: INTRO ATMOSFÉRICA -->
        <section class="visual-header animate-fade-up">
            <div class="container text-center">
                <span class="kicker">@lucainova</span>
                <h1 class="page-title">Diario de Escritura</h1>
                <p class="intro-text">
                    La narrativa no solo se lee; se observa. Fragmentos, texturas y el detrás de escena de la intriga.
                </p>

                <!-- Botón refactorizado -->
                <a href="https://www.instagram.com/lucainova/" target="_blank" class="btn btn--primary">
                    Seguir en Instagram
                </a>
            </div>
        </section>

        <!-- SECCIÓN 2: GRILLA MASONRY (Falso Feed) -->
        <section class="gallery-section">
            <div class="container">

                <div class="insta-grid">

                    <!-- POST 1 -->
                    <a href="https://www.instagram.com/lucainova/" target="_blank"
                        class="post-card animate-fade-up delay-1">
                        <img src="assets/images/insta-1.jpg" alt="Post de Instagram 1">
                        <div class="post-overlay">
                            <span class="overlay-text">Ver Post ↗</span>
                        </div>
                    </a>

                    <!-- POST 2 -->
                    <a href="https://www.instagram.com/lucainova/" target="_blank"
                        class="post-card animate-fade-up delay-2">
                        <img src="assets/images/insta-2.jpg" alt="Post de Instagram 2">
                        <div class="post-overlay">
                            <span class="overlay-text">Ver Post ↗</span>
                        </div>
                    </a>

                    <!-- POST 3 -->
                    <a href="https://www.instagram.com/lucainova/" target="_blank"
                        class="post-card animate-fade-up delay-3">
                        <img src="assets/images/insta-3.jpg" alt="Post de Instagram 3">
                        <div class="post-overlay">
                            <span class="overlay-text">Ver Post ↗</span>
                        </div>
                    </a>

                </div>

            </div>
        </section>

        <div class="spacer-xl"></div>
    </main>

    <script src="js/main.js" defer></script>
</body>

</html>
