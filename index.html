<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Luca Inova - Escritor de realismo inquietante. Una ucronía personal donde convivo con mis propias ficciones. Córdoba, Argentina." />
  <title>Luca Inova | Narrativa Oscura</title>
  <!-- 1. CARGA DE FUENTES DE ALTA VELOCIDAD -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- SOLUCIÓN: Cargamos New Rocker aquí. display=block evita el parpadeo de fuente fea -->
  <link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/core/global.css">
  <link rel="stylesheet" href="css/core/animations.css">
  <link rel="stylesheet" href="css/pages/home.css">

  <!-- 4. ANTI-PARPADEO VISUAL OPTIMIZADO -->
  <style>
    /* Aplicamos el hidden a una clase .reveal, o al 'main' y 'header' 
       directamente, NO al body, para no romper el fixed background */

    /* OPCIÓN A: Si usas la estructura body > main, ocultamos solo main y header */
    body>header,
    body>main {
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* El estado cargado se añade por JS */
    body.loaded>header,
    body.loaded>main {
      opacity: 1;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container nav-flex">
      <a href="index.html" class="logo">LUCA INOVA</a>
      <button class="mobile-menu-btn" aria-label="Alternar menú de navegación">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <nav class="nav-links">
        <a href="obras.html">Relatos</a>
        <a href="visual.html">Visual</a>
        <a href="sobre_mi.html">Sobre mí</a>
        <a href="contacto.html">Contacto</a>
      </nav>
      <div class="mobile-nav-overlay"></div>
    </div>
  </header>

  <main>
    <section id="hero" class="hero">

      <div class="hero-bg-wrapper">
        <picture>
          <source media="(min-width: 768px)" srcset="assets/images/hero-bg-desktop.jpg" />
          <img src="assets/images/hero-bg-mobile.jpg" alt="Atmósfera oscura - Bosque Desolado" />
        </picture>
      </div>

      <div class="hero-overlay"></div>

      <div class="container hero-content">
        <span class="hero-subtitle animate-fade-up delay-1">
          Escritor de realismo inquietante
        </span>
        <h1 class="hero-title animate-fade-up delay-2">
          Una ucronía personal donde convivo con mis propias ficciones.
        </h1>
        <div class="hero-buttons animate-fade-up delay-3">
          <a href="https://www.wattpad.com/user/lucainova" target="_blank" rel="noopener" class="btn btn--primary">
            Leer en Wattpad
          </a>
          <a href="https://www.instagram.com/lucainova/" target="_blank" rel="noopener" class="btn btn--secondary">
            Ver Instagram
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js" defer></script>
</body>

</html>
